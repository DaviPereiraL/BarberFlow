<div class="min-h-screen bg-background flex items-center justify-center p-6">
  <div class="bg-card border border-zinc-700 p-8 rounded-xl shadow-xl w-full max-w-md">
    
    <h2 class="text-3xl font-bold text-center text-primary mb-6">Entrar</h2>

    <div *ngIf="errorMessage" class="bg-red-900/30 border border-red-500 text-red-200 p-3 rounded mb-6 text-sm text-center animate-pulse">
      ⚠️ {{ errorMessage }}
    </div>

    <div class="space-y-4">
      <div>
        <label class="block text-xs text-zinc-400 uppercase font-bold mb-1">E-mail</label>
        <input [(ngModel)]="email" type="email" class="w-full bg-zinc-900 border border-zinc-600 text-white p-3 rounded focus:border-primary outline-none" placeholder="seu@email.com">
      </div>
      
      <div>
        <label class="block text-xs text-zinc-400 uppercase font-bold mb-1">Senha</label>
        <input [(ngModel)]="password" type="password" class="w-full bg-zinc-900 border border-zinc-600 text-white p-3 rounded focus:border-primary outline-none" placeholder="******">
      </div>

      <button (click)="onLogin()" [disabled]="isLoading" class="mt-4 w-full bg-primary text-white font-bold py-3 rounded hover:brightness-110 transition disabled:opacity-50 block">
        {{ isLoading ? 'Entrando...' : 'Entrar' }}
      </button>
    </div>

    <div class="mt-6 text-center text-sm text-zinc-400">
      Ainda não tem conta? 
      <a routerLink="/cadastro" class="text-primary hover:underline cursor-pointer font-bold">Criar Conta</a>
    </div>
    
    <div class="mt-4 text-center border-t border-zinc-800 pt-4">
      <a routerLink="/" class="text-xs text-zinc-500 hover:text-white transition">← Voltar para Home</a>
    </div>

  </div>
</div>
